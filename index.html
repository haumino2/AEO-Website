function footer(){return `<footer><div class="wrap footerline"><span>DSQUARE © 2026</span><a href="mailto:thework@dsquare.com.vn">thework@dsquare.com.vn</a><button type="button" data-action="privacy">${t('privacy')}</button></div></footer>`}
function preview(compact=false){return `<div class="product-preview"><div class="preview-head"><span>${t('sample')}</span><span>example.com</span></div><div class="score-row"><div class="score"><strong>62</strong><small>/ 100</small></div><div class="score-copy"><h3>${t('room')}</h3><p class="small">${t('readiness')}<br>${t('grade')}</p></div></div>${signals.map(p=>`<div class="preview-row"><span>${tr(p.name)}</span><b>${p.value} / ${p.max}</b></div>`).join('')}</div>`}
function entry(){return `<form id="entry-form" class="entry-form" novalidate><div class="entry-fields"><div><label class="field" for="site">${t('website')}</label><input class="text" id="site" name="website" type="text" inputmode="url" autocomplete="url" maxlength="300" placeholder="yourcompany.com" value="${esc(state.input.site)}" required${attr(state.invalid==='site','aria-invalid="true"')} aria-describedby="entry-error"></div><div><label class="field" for="email">${t('email')}</label><input class="text" id="email" name="email" type="email" autocomplete="email" maxlength="160" placeholder="you@company.com" value="${esc(state.input.email)}" required${attr(state.invalid==='email','aria-invalid="true"')} aria-describedby="entry-error"></div></div><label class="check-label"><input id="privacy-consent" type="checkbox" required${attr(state.input.privacy,'checked')}${attr(state.invalid==='privacy-consent','aria-invalid="true"')} aria-describedby="entry-error"><span>${t('agree')} <button class="text-button" type="button" data-action="privacy">${t('privacy')}</button> (${t('required')})</span></label><label class="check-label"><input id="newsletter-consent" type="checkbox"${attr(state.input.newsletter,'checked')}><span>${t('newsletter')}</span></label><div class="error" id="entry-error" role="alert">${state.error?t(state.error):''}</div>${state.info?`<p class="small">${t(state.info)}</p>`:''}<button class="primary wide" type="submit"${attr(state.busy,'disabled')}>${state.busy?t('busyButton'):t('check')}${arrow}</button><div class="entry-foot"><button class="text-button" type="button" data-action="example"${attr(state.busy,'disabled')}>${t('example')}</button></div></form>`}
function report(lead){if(!lead)return '';return `<section id="result" class="result-section" role="region" aria-label="${t('resultRegion')}" tabindex="-1"><div class="result-top"><div><div class="eyebrow">${t('report')}</div><h2>${esc(lead.site)}</h2></div><button class="outline" type="button" data-action="another">${t('newCheck')}</button></div><div class="report-layout"><aside class="report-summary"><div class="score-row"><div class="score"><strong>62</strong><small>/ 100</small></div><div class="score-copy"><h3>${t('room')}</h3><p class="small">${t('grade')}</p></div></div><p class="small">${t('reportScope')}</p><div class="priority"><div class="eyebrow">${t('recommended')}</div><h3>${t('priority')}</h3><p class="small">${t('priorityBody')}</p></div><p class="email-status">${t('preparedFor')}<br><strong>${esc(lead.email)}</strong><br>${t('notSent')}</p><button class="text-button" type="button" data-action="email" data-id="${lead.id}">${t('viewEmail')} ↗</button></aside><div class="report-signals">${signals.map((p,i)=>`<details class="metric"${i===0?' open':''}><summary><span class="name">${tr(p.name)}</span><b>${p.value} / ${p.max}</b><span class="expand" aria-hidden="true">+</span></summary><div class="meter" aria-hidden="true"><i style="width:${p.value/p.max*100}%"></i></div><p>${tr(p.finding)}</p><p class="fix">${tr(p.fix)}</p></details>`).join('')}</div></div><div class="report-convert"><div><h3>${t('convertTitle')}</h3><p>${t('convertBody')}</p></div><button class="primary" type="button" data-action="book" data-id="${lead.id}">${t('book')}${arrow}</button></div></section>`}
function result(){if(state.busy)return `<section id="result" class="result-section" role="status" aria-live="polite" aria-busy="true"><div class="busy-panel"><div class="eyebrow">${t('sampleState')}</div><h2>${t('busyTitle')}</h2><p class="small">${t('busyBody')}</p><div class="loading-line" aria-hidden="true"><i></i></div></div></section>`;if(state.failure)return `<section id="result" class="result-section" tabindex="-1" role="alert"><div class="failure"><h2>${t('failed')}</h2><p class="muted">${t(state.failure)}</p><button class="primary" type="button" data-action="retry">${t('retry')}${arrow}</button><p class="fine" style="margin-top:13px">${t('retryNote')}</p></div></section>`;return report(state.current)}
function main(){return `<main id="main" class="wrap"><section class="hero"><div class="hero-copy"><div class="eyebrow">DSQUARE AI Visibility Checker</div><h1>${t('heroTitle')}</h1><p class="muted">${t('heroBody')}</p>${entry()}</div>${preview()}</section>${result()}<section class="section split"><div><div class="eyebrow">${t('whyLabel')}</div><h2>${t('whyTitle')}</h2><p class="lead">${t('whyBody')}</p></div><div>${[['whyOne','whyOneBody'],['whyTwo','whyTwoBody'],['whyThree','whyThreeBody']].map(([a,b])=>`<article class="editorial-row"><h3>${t(a)}</h3><p>${t(b)}</p></article>`).join('')}</div></section><section class="section" id="checks"><div class="eyebrow">${t('sixLabel')}</div><h2>${t('sixTitle')}</h2><p class="lead">${t('sixBody')}</p><div class="signal-grid">${signals.map(p=>`<article class="signal"><header><h3>${tr(p.name)}</h3><span class="num">/ ${p.max}</span></header><p>${tr(p.desc)}</p></article>`).join('')}</div></section><section class="section sample-layout"><div><div class="eyebrow">${t('sample')}</div><h2>${t('sampleTitle')}</h2><p class="lead">${t('sampleBody')}</p><button class="text-button" type="button" data-action="another">${t('sampleLink')} ↗</button></div>${preview(true)}</section><section class="section" id="services"><div class="eyebrow">${t('beyond')}</div><h2>${t('beyondTitle')}</h2><p class="lead">${t('beyondBody')}</p><div class="services">${[['free','review','reviewBody'],['paidOnce','audit','auditBody'],['retainer','implementation','implementationBody']].map(([a,b,c])=>`<article class="service"><div class="eyebrow">${t(a)}</div><h3>${t(b)}</h3><p>${t(c)}</p>${b==='review'?`<button class="text-button" type="button" data-action="book">${t('book')} ↗</button>`:''}</article>`).join('')}</div></section><section class="section"><h2>${t('faq')}</h2><div class="faq">${[1,2,3,4].map(i=>`<details><summary>${t('q'+i)}</summary><p>${t('a'+i)}</p></details>`).join('')}</div></section><section class="last-cta"><div><h2>${t('finalTitle')}</h2><p>${t('finalBody')}</p></div><button class="outline" type="button" data-action="another">${t('check')}${arrow}</button></section></main>`}
function leadById(id){return state.leads.find(l=>l.id===id)||state.current}
function sourceData(){const p=new URLSearchParams(location.search);return {source:(p.get('utm_source')||'').slice(0,100),medium:(p.get('utm_medium')||'').slice(0,100),campaign:(p.get('utm_campaign')||'').slice(0,100)}}
function workspace(){return `<main id="main" class="wrap workspace"><div class="workspace-head"><div><div class="eyebrow">DSQUARE · ${t('sampleState')}</div><h1>${t('workspace')}</h1><p class="small">${t('workspaceBody')}</p></div><button class="outline" type="button" data-action="reset">${t('reset')}</button></div><div class="workspace-nav"><a href="#">${t('backChecker')} ↗</a><a href="#inbox">${t('inbox')} ↗</a><span class="fine">${state.leads.length} ${state.lang==='en'?(state.leads.length===1?'record':'records'):'bản ghi'}</span></div><div class="workspace-tools"><div><label for="scenario">${t('scenario')}</label><p class="fine" style="margin:4px 0 0">${t('scenarioNote')}</p></div><select id="scenario" class="text"><option value="success"${attr(state.scenario==='success','selected')}>${t('success')}</option><option value="timeout"${attr(state.scenario==='timeout','selected')}>${t('scenarioTimeout')}</option><option value="quota"${attr(state.scenario==='quota','selected')}>${t('scenarioQuota')}</option></select></div>${state.leads.length?`<div class="table-scroll"><table><thead><tr>${['date','website','scoreLabel','email','source','consents','status','actions'].map(k=>`<th scope="col">${t(k)}</th>`).join('')}</tr></thead><tbody>${state.leads.map(l=>`<tr><td>${fmt(l.createdAt)}</td><td>${esc(l.site)}${l.booking?`<p class="source-detail">${t('name')}: ${esc(l.booking.name||'—')}<br>${t('company')}: ${esc(l.booking.company||'—')}<br>${t('country')}: ${esc(l.booking.country||'—')}<br>${fmt(l.booking.slot)} · ${l.booking.language.toUpperCase()}</p>`:''}</td><td>62 / 100</td><td>${esc(l.email)}</td><td>${esc(l.source.source)||t('direct')}<p class="source-detail">${esc(l.source.medium)}<br>${esc(l.source.campaign)}</p></td><td>${t('reportConsent')}: ${t('yes')}<br>${t('newsletterLabel')}: ${t(l.newsletter?'yes':'no')}<p class="source-detail">${t('consentTime')}: ${fmt(l.createdAt)}<br>${t('noticeVersion')}: demo-v2</p></td><td><select data-status="${l.id}" aria-label="${t('status')} ${esc(l.site)}">${['new','reviewRequested','auditProposed','implementationStatus','monitoringStatus'].map(k=>`<option value="${k}"${attr(l.status===k,'selected')}>${t(k)}</option>`).join('')}</select></td><td><button class="text-button" type="button" data-action="open-report" data-id="${l.id}">${t('reportButton')}</button><br><button class="text-button" type="button" data-action="email" data-id="${l.id}">${t('emailAction')}</button></td></tr>`).join('')}</tbody></table></div><p class="fine" style="margin-top:16px">${t('seedNote')}</p>`:emptyState()}</main>`}
function emptyState(){return `<div class="empty-state"><h3>${t('empty')}</h3><p class="small">${t('emptyBody')}</p><a class="outline" href="#">${t('backChecker')}</a></div>`}
function inbox(){return `<main id="main" class="wrap workspace"><div class="eyebrow">DSQUARE · ${t('sampleState')}</div><h1>${t('inbox')}</h1><p class="small">${t('inboxBody')}</p><div class="workspace-nav"><a href="#">${t('backChecker')} ↗</a><a href="#workspace">${t('workspace')} ↗</a></div>${state.leads.length?`<div class="inbox-list">${state.leads.map(l=>`<article class="inbox-item"><p class="fine">${t('to')}: ${esc(l.email)}</p><h3>${t('emailSubject')}</h3><p class="muted">${esc(l.site)} · 62 / 100</p><p class="fine">${t('notSent')}</p><button class="text-button" type="button" data-action="email" data-id="${l.id}">${t('viewEmail')} ↗</button></article>`).join('')}</div>`:emptyState()}</main>`}
function render(){document.documentElement.lang=state.lang;document.title='AI Visibility Checker | DSQUARE';activeRoute=route();app.innerHTML=nav()+(activeRoute==='main'?main():activeRoute==='workspace'?workspace():inbox())+footer();if(state.modal)renderDialog()}
function modalShell(content){return `<div class="modal-top"><span class="eyebrow">DSQUARE</span><button class="close" type="button" data-action="close" aria-label="${t('close')}">×</button></div>${content}`}
function bookingContent(l){const b=state.booking;return `<h2 id="dialog-title">${t('reviewTitle')}</h2><p class="small">${t('reviewIntro')}</p><div class="context"><p>${esc(l.site)}</p><p class="muted">${esc(l.email)}</p></div><form id="booking-form" novalidate><label class="field" for="booking-language">${t('reviewLanguage')}</label><select class="text" id="booking-language"><option value="en"${attr(b.language==='en','selected')}>English</option><option value="vi"${attr(b.language==='vi','selected')}>Tiếng Việt</option></select><fieldset><legend>${t('chooseSlot')}</legend><p class="fine" style="margin:5px 0">${t('timezone')}</p><div class="slot-grid">${slots.map((slot,i)=>`<label class="slot"><input type="radio" name="slot" value="${slot}"${attr(b.slot===slot,'checked')}><span>${fmt(slot)}</span></label>`).join('')}</div></fieldset><div class="form-pair"><div><label class="field" for="booking-name">${t('name')} (${t('optional')})</label><input class="text" id="booking-name" autocomplete="name" maxlength="80" value="${esc(b.name)}" placeholder="${t('fieldPlaceholder')}"></div><div><label class="field" for="booking-company">${t('company')} (${t('optional')})</label><input class="text" id="booking-company" autocomplete="organization" maxlength="100" value="${esc(b.company)}" placeholder="${t('companyPlaceholder')}"></div></div><label class="field" for="booking-country">${t('country')} (${t('optional')})</label><input class="text" id="booking-country" autocomplete="country-name" maxlength="80" value="${esc(b.country)}" placeholder="${t('countryPlaceholder')}"><div class="error" role="alert">${state.bookingError?t(state.bookingError):''}</div><button class="primary wide" type="submit">${t('requestReview')}${arrow}</button><p class="fine" style="margin:12px 0 0">${t('bookingNote')}</p></form>`}
function emailContent(l){return `<h2 id="dialog-title">${t('emailTitle')}</h2><p class="small">${t('to')}: ${esc(l.email)}<br>${t('subject')}: ${t('emailSubject')}</p><div class="email-paper"><div class="eyebrow">DSQUARE</div><h3 style="margin-top:15px">${esc(l.site)}</h3><p class="small">${t('emailIntro')}</p><div class="email-score">62 <small>/ 100</small></div>${signals.map(p=>`<div class="preview-row"><span>${tr(p.name)}</span><b>${p.value} / ${p.max}</b></div>`).join('')}<h3 style="font-size:20px;margin:22px 0 10px">${t('priority')}</h3><p class="small">${t('priorityBody')}</p><button class="primary wide" type="button" data-action="book" data-id="${l.id}">${t('book')}${arrow}</button></div><p class="fine" style="margin:15px 0 0">${t('emailFoot')}</p>`}
function renderDialog(){const l=leadById(state.modalLead);let body='';if(state.modal==='privacy'){body=`<h2 id="dialog-title">${t('privacyTitle')}</h2><p>${t('privacyIntro')}</p>${[1,2,3,4].map(i=>`<p class="small">${t('privacy'+i)}</p>`).join('')}<button class="primary wide" type="button" data-action="close">${t('understood')}</button>`}else if(state.modal==='email'&&l)body=emailContent(l);else if(state.modal==='booking'&&l)body=bookingContent(l);else if(state.modal==='booked'&&l?.booking){body=`<div class="confirmation"><h2 id="dialog-title">${t('bookingDone')}</h2><p class="small">${t('bookingDoneNote')}</p><div class="context"><p>${esc(l.site)}</p><p>${esc(l.email)}</p><p>${fmt(l.booking.slot)} · ${l.booking.language==='en'?'English':'Tiếng Việt'}</p></div><p class="small">${t('reviewIntro')}</p><button class="primary" type="button" data-action="back-report" data-id="${l.id}">${t('backReport')}${arrow}</button></div>`}dialog.innerHTML=modalShell(body)}
function openModal(kind,id){capture();if(!dialog.open)originControl=document.activeElement;state.modal=kind;state.modalLead=id||state.current?.id||null;renderDialog();if(!dialog.open)dialog.showModal();dialog.querySelector('.close')?.focus()}
function closeModal(){state.modal=null;dialog.close();if(originControl?.isConnected)originControl.focus()}
function scrollForm(){if(route()!=='main'){location.hash='';render()}$('site')?.focus({preventScroll:true});$('entry-form')?.scrollIntoView({behavior:'smooth',block:'center'})}
function normalized(raw){const u=new URL(raw.includes('://')?raw:'https://'+raw);if(!['https:','http:'].includes(u.protocol)||u.username||u.password||u.port||!u.hostname.includes('.')||/^[0-9.]+$/.test(u.hostname)||!u.hostname.split('.').every(x=>/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/.test(x))||/\.(local|internal|invalid)$/.test(u.hostname))throw Error();return {site:u.hostname,url:u.href}}
async function diagnose(){if(state.busy)return;capture();state.error='';state.invalid='';state.info='';let target;try{target=normalized(state.input.site.trim())}catch{state.error='badSite';state.invalid='site'}if(!state.error&&(!$('email').checkValidity()||!state.input.email.trim())){state.error='badEmail';state.invalid='email'}if(!state.error&&!state.input.privacy){state.error='badPrivacy';state.invalid='privacy-consent'}if(state.error){render();$(state.invalid)?.focus();return}state.busy=true;state.failure='';render();$('result')?.scrollIntoView({behavior:'smooth',block:'center'});const snapshot={...state.input},scenario=state.scenario,run=++state.generation;state.scenario='success';await new Promise(resolve=>setTimeout(resolve,1400));if(run!==state.generation)return;state.busy=false;if(scenario!=='success'){state.failure=scenario;render();$('result')?.focus();return}const existing=state.leads.find(l=>l.site===target.site&&l.email.toLowerCase()===snapshot.email.trim().toLowerCase());const lead={...(existing||{}),id:existing?.id||'demo-'+(++state.counter),site:target.site,url:target.url,email:snapshot.email.trim(),newsletter:snapshot.newsletter,privacy:true,noticeVersion:'demo-v2',createdAt:new Date().toISOString(),source:sourceData(),status:existing?.status||'new'};if(!existing)state.leads.unshift(lead);else state.leads[state.leads.indexOf(existing)]=lead;state.current=lead;render();$('result')?.focus({preventScroll:true});$('result')?.scrollIntoView({behavior:'smooth',block:'start'})}
function action(event){const x=event.target.closest('[data-action]');if(!x)return;const a=x.dataset.action;capture();if(a==='lang'){state.lang=x.dataset.lang;render();document.querySelector(`[data-action=lang][data-lang=${state.lang}]`)?.focus()}else if(a==='privacy')openModal('privacy');else if(a==='close')closeModal();else if(a==='example'){state.input.site='example.com';state.input.email='alex@example.com';state.error='';state.invalid='';render();$('privacy-consent').focus()}else if(a==='another'){scrollForm()}else if(a==='email')openModal('email',x.dataset.id);else if(a==='book'){const lead=leadById(x.dataset.id);if(!lead){state.info='reviewFirst';render();scrollForm();return}state.bookingError='';if(!lead.booking)state.booking={...initialBooking(),language:state.lang};else state.booking={...lead.booking};openModal('booking',lead.id)}else if(a==='retry'){state.scenario='success';diagnose()}else if(a==='open-report'||a==='back-report'){const lead=leadById(x.dataset.id);if(dialog.open)closeModal();state.current=lead;state.failure='';location.hash='';render();requestAnimationFrame(()=>{$('result')?.focus({preventScroll:true});$('result')?.scrollIntoView({behavior:'smooth',block:'start'})})}else if(a==='reset'){state.generation++;state.busy=false;state.leads=[];state.current=null;state.input={site:'',email:'',privacy:false,newsletter:false};state.error='';state.failure='';state.scenario='success';state.booking=initialBooking();render()}}
app.addEventListener('click',action);dialog.addEventListener('click',action);app.addEventListener('submit',e=>{if(e.target.id==='entry-form'){e.preventDefault();diagnose()}});dialog.addEventListener('submit',e=>{if(e.target.id!=='booking-form')return;e.preventDefault();capture();if(!state.booking.slot){state.bookingError='slotError';renderDialog();dialog.querySelector('input[name=slot]')?.focus();return}const l=leadById(state.modalLead);l.booking={...state.booking};l.status='reviewRequested';state.modal='booked';renderDialog();$('dialog-title')?.setAttribute('tabindex','-1');$('dialog-title')?.focus()});dialog.addEventListener('cancel',()=>{state.modal=null});app.addEventListener('change',e=>{if(e.target.id==='scenario')state.scenario=e.target.value;if(e.target.dataset.status){const l=leadById(e.target.dataset.status);if(l)l.status=e.target.value}});app.addEventListener('input',e=>{if(['site','email'].includes(e.target.id)){state.error='';state.invalid='';e.target.removeAttribute('aria-invalid');$('entry-error').textContent=''}});window.addEventListener('hashchange',()=>{if(route()!==activeRoute){capture();if(dialog.open)closeModal();render();window.scrollTo({top:0})}});render();
})();
</script></body></html>
